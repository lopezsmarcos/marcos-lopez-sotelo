<title>Marcos López Sotelo — CV Interactivo</title>
<style>
:root{
  --sky1:#8ecae6; --sky2:#219ebc; --ground:#5a3825; --grass:#4a7c3f;
  --panel:#fff8e7; --ink:#22252a; --accent:#e76f51; --accent2:#2a9d8f; --gold:#e9b949;
}
@media (prefers-color-scheme: dark){
  :root{ --panel:#1e2127; --ink:#f2ede0; }
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;font-family:'Trebuchet MS',Verdana,sans-serif;background:var(--sky1);color:var(--ink);overflow-x:hidden;}
body{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);}
header{text-align:center;padding:18px 12px 10px;background:linear-gradient(var(--sky2),var(--sky1));display:flex;flex-direction:column;align-items:center;gap:8px;}
#avatar{width:78px;height:78px;border-radius:50%;object-fit:cover;border:4px solid #fff;box-shadow:0 3px 8px rgba(0,0,0,.3);}
header h1{margin:0;font-size:1.5rem;letter-spacing:1px;}
header p{margin:0;font-size:.82rem;opacity:.85;}
#contactBtn{display:inline-block;margin-top:4px;background:var(--accent);color:#fff;text-decoration:none;padding:7px 16px;border-radius:20px;font-size:.85rem;font-weight:bold;box-shadow:0 3px 0 #b9532f;}
#contactBtn:active{transform:translateY(2px);box-shadow:none;}
#instructions{text-align:center;font-size:.8rem;padding:4px;opacity:.75;}
#world{position:relative;height:200px;overflow-x:auto;overflow-y:hidden;background:linear-gradient(var(--sky1),var(--sky2) 70%);border-top:3px solid #fff;border-bottom:3px solid var(--ground);}
#track{position:relative;height:100%;background:repeating-linear-gradient(90deg,var(--grass) 0 40px,#3f6b35 40px 42px);}
.station{position:absolute;bottom:0;width:6px;height:70px;background:var(--ground);}
.station .flag{position:absolute;top:-38px;left:6px;background:var(--accent);color:#fff;font-size:.6rem;padding:3px 6px;border-radius:4px;white-space:nowrap;font-weight:bold;box-shadow:0 2px 4px rgba(0,0,0,.3);}
.station.active .flag{background:var(--accent2);}
.station .badge{position:absolute;top:-58px;left:2px;width:20px;height:20px;border-radius:50%;color:#fff;font-size:.55rem;font-weight:bold;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 3px rgba(0,0,0,.3);}
.station .dot{position:absolute;bottom:70px;left:-6px;width:18px;height:18px;border-radius:50%;background:#fff;border:3px solid var(--accent);}
.station.active .dot{background:var(--accent2);border-color:#fff;}
.station.final .dot{background:var(--gold);border-color:#fff;}
#hero{position:absolute;bottom:70px;width:32px;height:48px;transition:left .5s ease;}
#hero.walking{animation:bounce .3s infinite alternate;}
@keyframes bounce{from{transform:translateY(0);}to{transform:translateY(-3px);}}
#hero .head{width:17px;height:17px;background:#ffd8a8;border-radius:50%;margin:0 auto;position:relative;box-shadow:inset -2px -2px 0 rgba(0,0,0,.08);}
#hero .hair{position:absolute;top:-3px;left:1px;width:15px;height:9px;background:#3a2a1e;border-radius:9px 9px 0 0;}
#hero .torso{width:21px;height:19px;background:var(--accent);border-radius:6px;margin:1px auto 0;position:relative;}
#hero .tie{position:absolute;top:1px;left:8.5px;width:4px;height:11px;background:#c1121f;clip-path:polygon(50% 0,100% 20%,68% 100%,32% 100%,0 20%);}
#hero .arm{position:absolute;top:1px;width:5px;height:15px;background:#ffd8a8;border-radius:3px;transform-origin:top center;}
#hero .arm-l{left:-4px;} #hero .arm-r{right:-4px;}
#hero.walking .arm-l{animation:armL .3s infinite alternate;}
#hero.walking .arm-r{animation:armR .3s infinite alternate;}
@keyframes armL{from{transform:rotate(22deg);}to{transform:rotate(-22deg);}}
@keyframes armR{from{transform:rotate(-22deg);}to{transform:rotate(22deg);}}
#hero .legs{width:21px;height:14px;margin:0 auto;position:relative;}
#hero .leg{position:absolute;width:6px;height:14px;background:#2b2f36;border-radius:0 0 3px 3px;top:0;transform-origin:top center;}
#hero .shoe{position:absolute;bottom:-2px;width:8px;height:4px;background:#111;border-radius:2px;}
.leg-l{left:1px;} .leg-r{right:1px;}
.leg-l .shoe{left:-1px;} .leg-r .shoe{right:-1px;}
#hero.walking .leg-l{animation:step .3s infinite alternate;}
#hero.walking .leg-r{animation:step .3s infinite alternate-reverse;}
@keyframes step{from{transform:rotate(-20deg);}to{transform:rotate(20deg);}}
#controls{display:flex;justify-content:center;gap:10px;padding:12px;}
#controls button{font-size:1.3rem;padding:8px 20px;border:none;border-radius:10px;background:var(--accent);color:#fff;cursor:pointer;box-shadow:0 3px 0 #b9532f;}
#controls button:active{transform:translateY(2px);box-shadow:none;}
#panel{max-width:640px;margin:0 auto 26px;background:var(--panel);border-radius:14px;padding:20px 22px;box-shadow:0 4px 14px rgba(0,0,0,.15);}
#panel h2{margin:0 0 2px;color:var(--accent);}
#panel .meta{font-size:.85rem;opacity:.75;margin-bottom:10px;}
#panel ul{margin:6px 0 0;padding-left:20px;}
#panel li{margin-bottom:4px;font-size:.92rem;}
.badgesGrid{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;}
.achv{background:#fff;color:#22252a;border:2px solid var(--gold);border-radius:10px;padding:6px 10px;font-size:.78rem;display:flex;align-items:center;gap:6px;box-shadow:0 2px 4px rgba(0,0,0,.12);}
.achv .medal{font-size:1rem;}
.skillscloud{margin-top:12px;display:flex;flex-wrap:wrap;gap:6px;}
.skillscloud span{background:var(--accent2);color:#fff;font-size:.72rem;padding:3px 8px;border-radius:12px;}
#progress{max-width:640px;margin:0 auto;text-align:center;font-size:.8rem;opacity:.7;}
footer{text-align:center;padding:20px 12px 30px;font-size:.82rem;}
footer a{color:var(--accent2);font-weight:bold;text-decoration:none;}
</style>
</head>

 {y:"2014–15",t:"Technical Developer",c:"Universidad de Belgrano",b:["Reingeniería de sistema contable en ASP.NET (C#)","Diseño con Enterprise Architect, stored procedures y AJAX"]},
 {y:"2010–18",t:"Business System Analyst",c:"IBM IT",b:["Gestión de proyectos, SQL y desarrollo en Java","Base de conocimiento y priorización de incidentes"]},
 {y:"2010–14",t:"Technical Developer",c:"College ORT Argentina",b:["Desarrollo ASP.NET / SQL Server, soporte a usuarios","Diseño y documentación con UML y casos de prueba"]},
 {y:"2009–10",t:"Business System Analyst",c:"American Express",b:["Programación ASP.NET, SQL Server y JavaScript","Modelado de datos, prototipos y metodologías ágiles"]},
 {y:"2008–09",t:"Technical Functional Analyst",c:"Johnson & Johnson",b:["Proyecto Global HR Transformation (SAP-R3)","Migración Velocity (XP→Vista) y Customer to Cash (LatAm)"]},
 {y:"2008",t:"Global Operator",c:"IBM",b:["Operación de Mainframe y sistemas distribuidos (Z/OS2, JCL, RACF)","Monitoreo de servidores Unix/Windows y gestión de tickets"]},
 {y:"2007–08",t:"Functional Analyst",c:"Banco Mariva",b:["Sistemas vinculados a mercados financieros (MAE, OCT, ROFEX)","Planes de testing, documentación y soporte a usuarios"]},
 {y:"2005–07",t:"Functional Analyst",c:"MAE",b:["Relevamiento y documentación de requerimientos de software","Planes de capacitación y manuales de usuario"]},
 {y:"★ Bonus",t:"Logros desbloqueados",c:"Educación & Certificaciones",final:true,
   achv:["🎓 Universidad Austral — IT Management","🏆 Scrum Master (IBM & J&J)","📊 Power BI (Crehana)","🎯 OKRs (ITBA)","🤖 UiPath & Liderazgo (Udemy)","✅ CMMI/TMMI (Universidad CAECE)"],
   skills:["SAP","UML","Oracle SQL","JIRA","Java","Linux","Postman","Spring MVC","Hibernate","BootStrap","jQuery","CSS3","Enterprise Architect"]}
];
const track=document.getElementById('track'), hero=document.getElementById('hero'),
      panel=document.getElementById('panel'), progress=document.getElementById('progress'),
      world=document.getElementById('world');
const GAP=110, START=40;
let idx=0;
function colorFor(str){let h=0;for(const ch of str)h=ch.charCodeAt(0)+((h<<5)-h);const hue=Math.abs(h)%360;return `hsl(${hue},55%,42%)`;}
function initials(str){return str.split(/\s|&/).filter(Boolean).slice(0,2).map(w=>w[0]).join('').toUpperCase();}
stations.forEach((s,i)=>{
  const st=document.createElement('div');
  st.className='station'+(s.final?' final':'');
  st.style.left=(START+i*GAP)+'px';
  const badgeHtml = s.final ? '⭐' : initials(s.c);
  const badgeColor = s.final ? 'var(--gold)' : colorFor(s.c);
  st.innerHTML=`<div class="dot"></div><div class="badge" style="background:${badgeColor}">${badgeHtml}</div><div class="flag">${s.y}</div>`;
  st.onclick=()=>{idx=i;render(true);};
  track.appendChild(st);
});
track.style.width=(START+stations.length*GAP+60)+'px';

function render(scroll){
  hero.style.left=(START+idx*GAP-7)+'px';
  document.querySelectorAll('.station').forEach((el,i)=>el.classList.toggle('active',i===idx));
  const s=stations[idx];
  if(s.final){
    panel.innerHTML=`<h2>${s.t}</h2><div class="meta">${s.c}</div>
      <div class="badgesGrid">${s.achv.map(a=>'<div class="achv"><span class="medal">'+a.slice(0,2)+'</span>'+a.slice(2)+'</div>').join('')}</div>
      <div class="meta" style="margin-top:12px;">Stack técnico</div>
      <div class="skillscloud">${s.skills.map(k=>'<span>'+k+'</span>').join('')}</div>
      <div class="meta" style="margin-top:12px;">Idiomas: Español (nativo) · Inglés (C1)</div>`;
  } else {
    panel.innerHTML=`<h2>${s.t}</h2><div class="meta">${s.c} · ${s.y}</div><ul>${s.b.map(x=>'<li>'+x+'</li>').join('')}</ul>`;
  }
  progress.textContent=`Nivel ${idx+1} de ${stations.length}`;
  if(scroll) world.scrollTo({left:Math.max(0,START+idx*GAP-world.clientWidth/2),behavior:'smooth'});
  hero.classList.add('walking');
  clearTimeout(window._w); window._w=setTimeout(()=>hero.classList.remove('walking'),450);
}
function move(d){ idx=Math.min(stations.length-1,Math.max(0,idx+d)); render(true); }
document.getElementById('next').onclick=()=>move(1);
document.getElementById('prev').onclick=()=>move(-1);
window.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight')move(1);
  if(e.key==='ArrowLeft')move(-1);
});
render(false);
</script>
</body>
